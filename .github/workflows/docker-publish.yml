# DEPRECATED (GHA-006): tagged images via release.yml. Manual emergency republish only.
name: docker-publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Docker image tag (e.g. v2.0.5 or latest-release)"
        required: true
        default: "v2.0.5"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Build
        run: ci/build.sh
        env:
          VITE_HUB_ACCESS_KEY: ${{ secrets.HUB_ACCESS_KEY }}
          VITE_HUB_AUTH_USER: ${{ secrets.HUB_AUTH_USER }}
          VITE_HUB_AUTH_PASS: ${{ secrets.HUB_AUTH_PASS }}

      - name: Push Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_IMAGE: qaguru/selenoid-ui
        run: ci/docker-push.sh "${{ inputs.version }}"
